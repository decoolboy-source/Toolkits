<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#0e2a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- snowflake crystal (top) - scaled/positioned within the maskable safe zone -->
  <g transform="translate(256,180)" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-0.0" y1="46.0" x2="0.0" y2="-46.0"/>
    <line x1="0.0" y1="-28.5" x2="7.7" y2="-39.6"/>
    <line x1="0.0" y1="-28.5" x2="-7.7" y2="-39.6"/>
    <line x1="-0.0" y1="28.5" x2="-7.7" y2="39.6"/>
    <line x1="-0.0" y1="28.5" x2="7.7" y2="39.6"/>
    <line x1="39.8" y1="-23.0" x2="-39.8" y2="23.0"/>
    <line x1="-24.7" y1="14.3" x2="-38.1" y2="13.1"/>
    <line x1="-24.7" y1="14.3" x2="-30.4" y2="26.5"/>
    <line x1="24.7" y1="-14.3" x2="38.1" y2="-13.1"/>
    <line x1="24.7" y1="-14.3" x2="30.4" y2="-26.5"/>
    <line x1="-39.8" y1="-23.0" x2="39.8" y2="23.0"/>
    <line x1="24.7" y1="14.3" x2="30.4" y2="26.5"/>
    <line x1="24.7" y1="14.3" x2="38.1" y2="13.1"/>
    <line x1="-24.7" y1="-14.3" x2="-30.4" y2="-26.5"/>
    <line x1="-24.7" y1="-14.3" x2="-38.1" y2="-13.1"/>
  </g>

  <!-- thermometer (bottom) -->
  <g transform="translate(256,332)">
    <rect x="-19" y="-90" width="38" height="130" rx="19" fill="none" stroke="#3a4762" stroke-width="12"/>
    <circle r="40" fill="none" stroke="#3a4762" stroke-width="12"/>
    <rect x="-9" y="-60" width="18" height="100" rx="9" fill="url(#accent)"/>
    <circle r="28" fill="url(#accent)"/>
  </g>
</svg>
