<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#0e2a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1c2333" stroke-width="2"/>

  <!-- snowflake crystal (top): 3 axes through center, each with symmetric branch tips -->
  <g transform="translate(256,168)" stroke="url(#accent)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="55" x2="0" y2="-55"/>
    <line x1="0" y1="-34.1" x2="9.2" y2="-47.2"/>
    <line x1="0" y1="-34.1" x2="-9.2" y2="-47.2"/>
    <line x1="0" y1="34.1" x2="-9.2" y2="47.2"/>
    <line x1="0" y1="34.1" x2="9.2" y2="47.2"/>
    <line x1="47.6" y1="-27.5" x2="-47.6" y2="27.5"/>
    <line x1="-29.5" y1="17.1" x2="-45.5" y2="15.7"/>
    <line x1="-29.5" y1="17.1" x2="-36.3" y2="31.6"/>
    <line x1="29.5" y1="-17.1" x2="45.5" y2="-15.7"/>
    <line x1="29.5" y1="-17.1" x2="36.3" y2="-31.6"/>
    <line x1="-47.6" y1="-27.5" x2="47.6" y2="27.5"/>
    <line x1="29.5" y1="17.1" x2="36.3" y2="31.6"/>
    <line x1="29.5" y1="17.1" x2="45.5" y2="15.7"/>
    <line x1="-29.5" y1="-17.1" x2="-36.3" y2="-31.6"/>
    <line x1="-29.5" y1="-17.1" x2="-45.5" y2="-15.7"/>
  </g>

  <!-- thermometer (bottom) -->
  <g transform="translate(256,336)">
    <rect x="-22" y="-104" width="44" height="150" rx="22" fill="none" stroke="#3a4762" stroke-width="14"/>
    <circle r="46" fill="none" stroke="#3a4762" stroke-width="14"/>
    <rect x="-10" y="-70" width="20" height="118" rx="10" fill="url(#accent)"/>
    <circle r="32" fill="url(#accent)"/>
  </g>
</svg>
