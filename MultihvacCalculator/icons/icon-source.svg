<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e2e3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- gauge arc -->
  <g transform="translate(256,236)">
    <circle r="128" fill="none" stroke="#1e293b" stroke-width="14"/>
    <path d="M -113.1 56.6 A 128 128 0 1 1 113.1 56.6" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <!-- needle -->
    <line x1="0" y1="0" x2="62" y2="-58" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
    <circle r="13" fill="#e2e8f0"/>
    <!-- tick marks -->
    <g stroke="#64748b" stroke-width="6" stroke-linecap="round">
      <line x1="-128" y1="0" x2="-108" y2="0"/>
      <line x1="0" y1="-128" x2="0" y2="-108"/>
      <line x1="128" y1="0" x2="108" y2="0"/>
    </g>
  </g>

  <!-- baseline: calculator grid -->
  <g transform="translate(166,384)" fill="url(#accent)">
    <rect x="0"  y="0" width="34" height="34" rx="8"/>
    <rect x="46" y="0" width="34" height="34" rx="8"/>
    <rect x="92" y="0" width="34" height="34" rx="8"/>
    <rect x="138" y="0" width="34" height="34" rx="8"/>
  </g>
</svg>
