<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e2e3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- gauge arc -->
  <g transform="translate(256,236)">
    <circle r="118" fill="none" stroke="#1e293b" stroke-width="13"/>
    <path d="M -104.3 52.2 A 118 118 0 1 1 104.3 52.2" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="57" y2="-53" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    <circle r="12" fill="#e2e8f0"/>
    <g stroke="#64748b" stroke-width="6" stroke-linecap="round">
      <line x1="-118" y1="0" x2="-100" y2="0"/>
      <line x1="0" y1="-118" x2="0" y2="-100"/>
      <line x1="118" y1="0" x2="100" y2="0"/>
    </g>
  </g>

  <!-- baseline: calculator grid -->
  <g transform="translate(170,378)" fill="url(#accent)">
    <rect x="0"  y="0" width="32" height="32" rx="7"/>
    <rect x="44" y="0" width="32" height="32" rx="7"/>
    <rect x="88" y="0" width="32" height="32" rx="7"/>
    <rect x="132" y="0" width="32" height="32" rx="7"/>
  </g>
</svg>
